<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waddle Dee Theme Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: #fffef0;
            
            /* ENLACE DIRECTO A TU ANIMACIÓN (Cambia .webp por .gif si es necesario) */
            background-image: url('https://githubusercontent.com');
            
            /* Ajustes universales para PC, Linux y Móvil */
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed; /* Evita lag en el scroll (Anti-Crash) */
            background-color: #2e432c; /* Color de respaldo por si el internet falla */
        }
        .container {
            background: rgba(46, 67, 44, 0.85); /* Verde hoja de loto translúcido */
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 90%;
            border: 2px solid #ff7a45; /* Naranja Waddle Dee */
        }
        h1 { 
            color: #ff7a45; 
            margin-top: 0;
        }
        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Waddle Dee & Kirby</h1>
        <p>¡El fondo animado está funcionando perfectamente en PC, Linux y Android! 🌊</p>
    </div>
</body>
</html>
