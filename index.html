<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waddle Dee & Kirby Theme Preview</title>
    <style>
        /* --- FUENTE DE TEXTO PERSONALIZADA (ANTI-LAG) --- */
        @font-face {
            font-family: 'WaddleFont';
            /* Enlace Raw directo a tu archivo .ttf en GitHub */
            src: url('https://githubusercontent.com') format('truetype');
            font-display: swap; /* Muestra una fuente del sistema mientras carga (Evita bloqueos/crasheos) */
        }

        /* --- PALETA DE COLORES PERSONALIZADA --- */
        :root {
            --bg-principal: #2e432c;      
            --bg-paneles: rgba(29, 43, 28, 0.85); 
            --acento: #ff7a45;          
            --texto-claro: #fffef0;     
            --texto-muted: #9bb88d;     
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--texto-claro);
            overflow: hidden;
            background-color: var(--bg-principal);
            
            /* FONDO ANIMADO */
            background-image: url('https://githubusercontent.com');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            
            /* SISTEMA ANTI-CRASHEO ACELERACIÓN GPU */
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        /* PANEL PRINCIPAL */
        .container {
            background: var(--bg-paneles);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 90%;
            border: 2px solid var(--acento);
            backdrop-filter: blur(8px);
        }

        h1 { 
            font-family: 'WaddleFont', sans-serif; /* Aplicamos tu hermosa fuente aquí */
            color: var(--acento); 
            margin-top: 0; 
            font-size: 2.8rem; /* Un poco más grande para que luzca la caligrafía */
            letter-spacing: 1px;
        }

        p { color: var(--texto-claro); line-height: 1.6; }
        
        .btn-action {
            font-family: 'WaddleFont', sans-serif; /* También en los botones para dar estilo */
            background-color: var(--acento);
            color: var(--texto-claro);
            border: none;
            padding: 10px 24px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 5px;
            box-shadow: 0 4px 15px rgba(255, 122, 69, 0.3);
        }
        .btn-action:hover { transform: scale(1.05); }
        .btn-action:active { transform: scale(0.95); }

        /* PANTALLA DE STARTUP */
        #startup-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="startup-screen">
        <button class="btn-action" onclick="iniciarProyecto()">START GAME</button>
    </div>

    <div class="container">
        <h1>Waddle Dee & Kirby</h1>
        <p>Paleta, sonidos, tipografía caligráfica y escudo anti-crasheo listos de manera avanzada. 🌊</p>
        <button class="btn-action" onclick="reproducirClic()">Enviar Msg</button>
        <button class="btn-action" onclick="toggleMusica()">Música On/Off</button>
    </div>

    <script>
        const audioStartup = new Audio('https://githubusercontent.com');
        const audioClic = new Audio('https://githubusercontent.com');
        const audioFondo = new Audio('https://githubusercontent.com');
        
        audioFondo.loop = true;
        audioFondo.volume = 0.4;

        function iniciarProyecto() {
            audioStartup.play();
            document.getElementById('startup-screen').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('startup-screen').style.display = 'none';
                audioFondo.play().catch(e => console.log("Música diferida:", e));
            }, 500);
        }

        document.fonts.ready.then(() => {
            console.log("Fuente caligráfica cargada de forma segura (Anti-Crash)");
        });

        function reproducirClic() {
            audioClic.currentTime = 0; 
            audioClic.play();
        }

        function toggleMusica() {
            if (audioFondo.paused) {
                audioFondo.play();
            } else {
                audioFondo.pause();
            }
        }
    </script>
</body>
</html>
