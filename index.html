<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waddle Dee & Kirby Theme Preview</title>
    <style>
        /* --- FUENTE DE TEXTO PERSONALIZADA (ANTI-LAG) --- */
        @font-face {
            font-family: 'WaddleFont';
            src: url('assets/waddle_font.ttf') format('truetype');
            font-display: swap;
        }

        /* --- PALETA DE COLORES PERSONALIZADA --- */
        :root {
            --bg-principal: #2e432c;
            --bg-paneles: rgba(29, 43, 28, 0.78);
            --bg-paneles-strong: rgba(17, 26, 17, 0.9);
            --acento: #ff7a45;
            --acento-oscuro: #d9612a;
            --texto-claro: #fffef0;
            --texto-muted: #9bb88d;
            --reflejo: rgba(255, 255, 255, 0.14);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--texto-claro);
            overflow-x: hidden;
            background: linear-gradient(135deg, rgba(17, 26, 17, 0.92), rgba(46, 67, 44, 0.88));
            isolation: isolate;
        }

        body::before {
            content: '';
            position: fixed;
            inset: -8%;
            z-index: -2;
            background: url('assets/waddledeebackground.webp') center / cover no-repeat;
            animation: fondo-diagonal 30s ease-in-out infinite alternate;
            pointer-events: none;
            filter: saturate(1.1) contrast(1.08);
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 45%),
                        linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.38));
            pointer-events: none;
        }

        @keyframes fondo-diagonal {
            from { transform: translate(-3%, -3%) scale(1.06); }
            to { transform: translate(3%, 3%) scale(1.12); }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before {
                animation: none;
            }
        }

        /* PANEL PRINCIPAL */
        .container {
            background: linear-gradient(180deg, rgba(29, 43, 28, 0.8), rgba(17, 26, 17, 0.82));
            padding: 30px 28px 22px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255,255,255,0.08);
            max-width: 440px;
            width: 90%;
            border: 1px solid rgba(255, 122, 69, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 30%, transparent 60%, rgba(255,255,255,0.04));
            pointer-events: none;
        }

        h1 { 
            font-family: 'WaddleFont', sans-serif;
            color: var(--acento);
            margin-top: 0; 
            font-size: clamp(2.3rem, 5vw, 2.9rem);
            letter-spacing: 1px;
            text-shadow: 0 3px 8px rgba(0,0,0,0.35);
            position: relative;
            z-index: 1;
        }

        p { color: var(--texto-claro); line-height: 1.6; margin-bottom: 20px; position: relative; z-index: 1; }
        
        .btn-action {
            font-family: 'WaddleFont', sans-serif;
            background: linear-gradient(180deg, rgba(27, 42, 27, 0.95), rgba(15, 21, 15, 0.98));
            color: var(--texto-claro);
            border: 1px solid rgba(255, 122, 69, 0.7);
            padding: 10px 24px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, filter 0.2s ease;
            margin: 5px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            z-index: 1;
        }
        .btn-action:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
            border-color: rgba(255, 255, 255, 0.6);
            filter: brightness(1.05);
        }
        .btn-action:active { transform: scale(0.97); }

        .btn-action::before {
            content: '';
            position: absolute;
            inset: 1px 10% auto 10%;
            height: 16px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent);
            pointer-events: none;
        }

        /* --- PALETA DE COLORES INTERACTIVA --- */
        .palette-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 25px 0 15px 0;
            background: rgba(10, 13, 10, 0.28);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
        }

        .color-box {
            flex: 1;
            height: 55px;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            border: 1px solid rgba(255,255,255,0.18);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            font: inherit;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
        }

        .color-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.38);
            filter: brightness(1.08);
        }

        .color-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.22), transparent 40%, rgba(0,0,0,0.15));
            border-radius: inherit;
            pointer-events: none;
        }

        .color-box::after {
            content: 'Copiar';
            position: absolute;
            bottom: -22px;
            font-size: 0.65rem;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            color: #fff;
            font-family: sans-serif;
        }
        .color-box:hover::after { opacity: 1; }

        /* --- MENSAJE FLOTANTE DE COPIADO --- */
        #toast {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, rgba(29, 43, 28, 0.96), rgba(12, 18, 13, 0.96));
            color: var(--texto-claro);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
            border: 1px solid rgba(255, 122, 69, 0.45);
            transition: bottom 0.3s ease;
            z-index: 10000;
            font-size: 0.9rem;
            letter-spacing: 0.2px;
        }

        /* PANTALLA DE STARTUP */
        #startup-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at top, rgba(255, 122, 69, 0.18), rgba(17,26,17,0.92) 40%, rgba(7,10,7,1));
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="startup-screen">
        <button class="btn-action" type="button" onclick="iniciarProyecto()">Iniciar vista previa</button>
    </div>

    <div id="toast" role="status" aria-live="polite">Color copiado</div>

    <div class="container">
        <h1>Waddle Dee & Kirby</h1>
        <p>Explora la paleta, copia sus códigos HEX y escucha los sonidos incluidos en el tema.</p>
        
        <div class="palette-container">
            <button class="color-box" type="button" aria-label="Copiar color #2e432c" style="background-color: #2e432c;" onclick="copiarColor('#2e432c')"></button>
            <button class="color-box" type="button" aria-label="Copiar color #1d2b1c" style="background-color: #1d2b1c;" onclick="copiarColor('#1d2b1c')"></button>
            <button class="color-box" type="button" aria-label="Copiar color #ff7a45" style="background-color: #ff7a45;" onclick="copiarColor('#ff7a45')"></button>
            <button class="color-box" type="button" aria-label="Copiar color #fffef0" style="background-color: #fffef0;" onclick="copiarColor('#fffef0')"></button>
            <button class="color-box" type="button" aria-label="Copiar color #9bb88d" style="background-color: #9bb88d;" onclick="copiarColor('#9bb88d')"></button>
        </div>

        <button class="btn-action" type="button" onclick="reproducirSonido('enviar')">Enviar mensaje</button>
        <button class="btn-action" type="button" onclick="reproducirSonido('recibir')">Recibir mensaje</button>
        <button class="btn-action" type="button" onclick="reproducirSonido('llamada')">Inicio de llamada</button>
        <button class="btn-action" type="button" onclick="reproducirSonido('tono')">Tono de llamada</button>
    </div>

    <script>
        const sonidos = {
            enviar: new Audio('assets/waddle_send.mp3'),
            recibir: new Audio('assets/waddle_receive.mp3'),
            llamada: new Audio('assets/waddle_call_start.mp3'),
            tono: new Audio('assets/waddle_ringtone.mp3')
        };

        function iniciarProyecto() {
            document.getElementById('startup-screen').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('startup-screen').style.display = 'none';
            }, 500);
        }

        async function copiarColor(hex) {
            try {
                if (!navigator.clipboard?.writeText) {
                    throw new Error('Clipboard API is unavailable');
                }
                await navigator.clipboard.writeText(hex);
                mostrarAviso(`¡Copiado: ${hex}!`);
            } catch (error) {
                console.error('Error al copiar color:', error);
                mostrarAviso('No se pudo copiar. Abre la página mediante HTTPS.');
            }
        }

        function mostrarAviso(mensaje) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.style.bottom = '30px';
            setTimeout(() => {
                toast.style.bottom = '-50px';
            }, 2000);
        }

        function reproducirSonido(nombre) {
            const audio = sonidos[nombre];
            audio.currentTime = 0;
            audio.play().catch(error => console.error('No se pudo reproducir el sonido:', error));
        }
    </script>
</body>
</html>
