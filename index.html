<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waddle Dee & Kirby Theme Preview</title>
    <style>
        * { box-sizing: border-box; }

        /* --- FUENTE DE TEXTO PERSONALIZADA --- */
        @font-face {
            font-family: 'WaddleFont';
            src: url('assets/waddle_font.ttf') format('truetype');
            font-display: swap;
        }

        /* --- PALETA DE COLORES PERSONALIZADA --- */
        :root {
            --bg-principal: #2e432c;      /* Verde hoja de loto oscuro */
            --bg-paneles: rgba(29, 43, 28, 0.85); /* Verde translúcido esmerilado */
            --acento: #ff7a45;          /* Naranja Waddle Dee */
            --texto-claro: #fffef0;     /* Crema sombrilla */
            --texto-muted: #9bb88d;     /* Verde claro apagado */
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--texto-claro);
            overflow-x: hidden;
            background-color: var(--bg-principal);
            
            background-image: url('assets/waddle_background.png');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: scroll;
        }

        body.animated-background {
            background-image: url('assets/waddledeebackground.webp');
        }

        /* PANEL PRINCIPAL */
        .container {
            background: var(--bg-paneles);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: min(90%, 500px);
            border: 2px solid var(--acento);
            backdrop-filter: blur(8px);
        }

        h1 { 
            font-family: 'WaddleFont', sans-serif;
            color: var(--acento); 
            margin-top: 0; 
            font-size: 2.8rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        p { color: var(--texto-claro); line-height: 1.6; margin-bottom: 20px; }
        
        .btn-action {
            font-family: 'WaddleFont', sans-serif;
            background-color: var(--acento);
            color: #1d2b1c;
            border: none;
            padding: 10px 24px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 5px;
            box-shadow: 0 4px 15px rgba(255, 122, 69, 0.3);
        }
        .btn-action:hover { transform: scale(1.05); }
        .btn-action:active { transform: scale(0.95); }
        .btn-action:focus-visible, .color-box:focus-visible {
            outline: 3px solid var(--texto-claro);
            outline-offset: 3px;
        }

        /* --- PALETA DE COLORES INTERACTIVA --- */
        .palette-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(44px, 1fr));
            gap: 10px;
            margin: 25px 0 15px 0;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 12px;
        }

        .color-box {
            min-width: 44px;
            min-height: 44px;
            border-radius: 8px;
            cursor: pointer;
            padding: 0;
            background-image: none;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .color-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .color-box::after {
            content: 'Copiar';
            position: absolute;
            bottom: -22px;
            font-size: 0.65rem;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            color: #1d2b1c;
            font-family: sans-serif;
        }
        .color-box:hover::after { opacity: 1; }
        .color-box:focus-visible::after { opacity: 1; }

        /* --- MENSAJE FLOTANTE DE COPIADO --- */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff7a45;
            color: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 10000;
            font-size: 0.9rem;
            max-width: calc(100vw - 32px);
            text-align: center;
        }

        #toast.visible {
            opacity: 1;
            visibility: visible;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }

            .btn-action:hover, .btn-action:active, .color-box:hover {
                transform: none;
            }

            body.animated-background {
                background-image: url('assets/waddle_background.png');
            }
        }
    </style>
</head>
<body>

    <div id="toast" role="status" aria-live="polite"></div>

    <div class="container">
        <h1>Waddle Dee & Kirby</h1>
        <p>Explora la paleta y copia un color con un clic. La animación de fondo se carga solo si la activas.</p>
        
        <div class="palette-container">
            <button type="button" class="color-box" style="background-color: #2e432c;" data-color="#2e432c" aria-label="Copiar verde oscuro, #2e432c"></button>
            <button type="button" class="color-box" style="background-color: #1d2b1c;" data-color="#1d2b1c" aria-label="Copiar verde de panel, #1d2b1c"></button>
            <button type="button" class="color-box" style="background-color: #ff7a45;" data-color="#ff7a45" aria-label="Copiar naranja, #ff7a45"></button>
            <button type="button" class="color-box" style="background-color: #fffef0;" data-color="#fffef0" aria-label="Copiar crema, #fffef0"></button>
            <button type="button" class="color-box" style="background-color: #9bb88d;" data-color="#9bb88d" aria-label="Copiar verde musgo, #9bb88d"></button>
        </div>

        <button type="button" class="btn-action" id="send-sound">Enviar mensaje</button>
        <button type="button" class="btn-action" id="ring-sound">Reproducir tono</button>
        <button type="button" class="btn-action" id="toggle-background" aria-pressed="false">Activar fondo animado (21 MB)</button>
    </div>

    <script>
        /* --- RUTAS DE AUDIO DESDE LA CARPETA ASSETS --- */
        const audioClic = new Audio('assets/waddle_send.wav');
        const audioTono = new Audio('assets/waddle_ringtone.mp3');
        audioClic.preload = 'none';
        audioTono.preload = 'none';
        audioTono.volume = 0.4;

        const toast = document.getElementById('toast');
        let toastTimer;

        function mostrarAviso(mensaje) {
            toast.textContent = mensaje;
            toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 2500);
        }

        function copiarColorFallback(hex) {
            const input = document.createElement('textarea');
            input.value = hex;
            input.setAttribute('readonly', '');
            input.style.position = 'fixed';
            input.style.opacity = '0';
            document.body.appendChild(input);
            let copied;
            try {
                input.select();
                copied = document.execCommand('copy');
            } finally {
                input.remove();
            }
            if (!copied) throw new Error('El navegador no permitió copiar al portapapeles.');
        }

        async function copiarColor(hex) {
            try {
                if (navigator.clipboard?.writeText) {
                    try {
                        await navigator.clipboard.writeText(hex);
                    } catch {
                        copiarColorFallback(hex);
                    }
                } else {
                    copiarColorFallback(hex);
                }
                mostrarAviso(`¡Copiado: ${hex}! 🎨`);
                reproducirSonido(audioClic);
            } catch (error) {
                console.error('No se pudo copiar el color:', error);
                mostrarAviso(`No se pudo copiar. Código: ${hex}`);
            }
        }

        function reproducirSonido(audio) {
            audio.currentTime = 0;
            audio.play().catch(error => {
                console.error('No se pudo reproducir el sonido:', error);
                mostrarAviso('No se pudo reproducir el sonido.');
            });
        }

        document.querySelectorAll('.color-box').forEach(button => {
            button.addEventListener('click', () => copiarColor(button.dataset.color));
        });
        document.getElementById('send-sound').addEventListener('click', () => reproducirSonido(audioClic));
        document.getElementById('ring-sound').addEventListener('click', () => reproducirSonido(audioTono));

        const backgroundButton = document.getElementById('toggle-background');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (reducedMotion.matches) {
            backgroundButton.disabled = true;
            backgroundButton.textContent = 'Animación desactivada por preferencia del sistema';
        }
        reducedMotion.addEventListener('change', event => {
            backgroundButton.disabled = event.matches;
            if (event.matches) {
                document.body.classList.remove('animated-background');
                backgroundButton.setAttribute('aria-pressed', 'false');
                backgroundButton.textContent = 'Animación desactivada por preferencia del sistema';
            } else {
                backgroundButton.textContent = 'Activar fondo animado (21 MB)';
            }
        });
        backgroundButton.addEventListener('click', () => {
            const enabled = document.body.classList.toggle('animated-background');
            backgroundButton.setAttribute('aria-pressed', String(enabled));
            backgroundButton.textContent = enabled
                ? 'Desactivar fondo animado'
                : 'Activar fondo animado (21 MB)';
        });
    </script>
</body>
</html>
