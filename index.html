<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waddle Dee Theme Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: #fffef0;
            /* Enlace directo a tu imagen en tu propio repositorio */

            border: 1px solid #ff7a45;
        }
        h1 { color: #ff7a45; }

        <h1>Waddle Dee & Kirby Theme</h1>
